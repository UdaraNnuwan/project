apiVersion: apps/v1
kind: Deployment
metadata:
  name: bilstm-film-inference
  namespace: default
  labels:
    app: anomaly-detector
    component: ml-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-detector
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: anomaly-detector
        component: ml-inference
    spec:
      containers:
      - name: bilstm-inference-pod
        # Replace this with your built image, for example gcr.io/my-project/bilstm-inference:v1.
        image: <YOUR_DOCKER_REGISTRY_URL>/bilstm-film-inference:latest 
        imagePullPolicy: Always
        
        # Environment values used by the live inference container.
        env:
        - name: PROM_URL
          value: "http://35.206.92.147:9090/api/v1/query"
          
        # Resource settings for a small ML workload.
        resources:
          requests:
            cpu: "250m"       # Guaranteed 0.25 vCPU cores.
            memory: "512Mi"   # Guaranteed 512 MiB memory.
          limits:
            cpu: "1000m"      # Maximum 1 vCPU.
            memory: "1.5Gi"   # Maximum 1.5 GiB memory.
            
        # Add a liveness check here if you add a health endpoint later.
